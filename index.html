<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN (reemplaza style.css) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <title>To-do List</title>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <h1 class="text-3xl font-bold text-gray-800 mb-6">Mi To-do List</h1>

  <div class="todo-container bg-white rounded-2xl shadow-md p-6 w-full max-w-md">
    <input
      type="text"
      placeholder="Escribe una tarea..."
      disabled
      class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 text-gray-400 bg-gray-50 cursor-not-allowed"
    >
    <ul class="flex flex-col gap-2">
      <li class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-green-700 font-medium">
        ✔️ Estudiar HTML
      </li>
      <li id="li4" class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-green-700 font-medium">
        ✔️ Haciendo un To-do List
      </li>
    </ul>
  </div>

</body>
</html>
